services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recife}
      POSTGRES_DB: ${POSTGRES_DB:-recife156}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Raw documents: ticket rows as published and the weather API answers, untouched
  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs the data pipeline, trains the model and loads the raw documents once, then exits
  pipeline:
    build: .
    image: recife-156
    command: sh -c "python -m src.pipeline && python -m src.ml.train && python -m src.nosql.raw_store"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-recife}:${POSTGRES_PASSWORD:-recife}@db:5432/${POSTGRES_DB:-recife156}
      YEARS: ${YEARS:-2024,2025}
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:-assistant}
      MONGO_URL: mongodb://mongo:27017
    volumes:
      - .:/app

  # Serves the dashboard at http://localhost:8501 once the pipeline has loaded the data
  dashboard:
    build: .
    image: recife-156
    command: streamlit run app/main.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    depends_on:
      pipeline:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-recife}:${POSTGRES_PASSWORD:-recife}@db:5432/${POSTGRES_DB:-recife156}
      ASSISTANT_DATABASE_URL: postgresql+psycopg://assistant_readonly:${ASSISTANT_DB_PASSWORD:-assistant}@db:5432/${POSTGRES_DB:-recife156}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - .:/app

volumes:
  pgdata:
  mongodata:
