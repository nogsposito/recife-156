services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recife}
      POSTGRES_DB: ${POSTGRES_DB:-recife156}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs the data pipeline once (ingest, clean, load) and exits
  pipeline:
    build: .
    image: recife-156
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-recife}:${POSTGRES_PASSWORD:-recife}@db:5432/${POSTGRES_DB:-recife156}
      YEARS: ${YEARS:-2024,2025}
    volumes:
      - .:/app

  # Serves the dashboard at http://localhost:8501 once the pipeline has loaded the data
  dashboard:
    build: .
    image: recife-156
    command: streamlit run app/main.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    depends_on:
      pipeline:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-recife}:${POSTGRES_PASSWORD:-recife}@db:5432/${POSTGRES_DB:-recife156}
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - .:/app

volumes:
  pgdata:
