[project]
name = "recife-156"
version = "0.1.0"
description = "Data pipeline and analysis of Recife's 156 urban services requests (Emlurb)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "scipy>=1.14",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
notebooks = ["jupyterlab>=4.2", "ipykernel>=6.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
