[theme]
base = "dark"
primaryColor = "#5ab9fc"
backgroundColor = "#0a0d14"
secondaryBackgroundColor = "#131824"
textColor = "#e9edf3"
borderColor = "#232a38"
linkColor = "#5ab9fc"
linkUnderline = false
baseRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
font = "Outfit:https://fonts.googleapis.com/css2?family=Outfit:wght@400..700&display=swap, sans-serif"
codeFont = "DM Mono:https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = [500, 500, 500, 500, 500, 500]
dataframeHeaderBackgroundColor = "#131824"
chartCategoricalColors = ["#3d9be9", "#d95926", "#199e70", "#c98500"]

[theme.sidebar]
backgroundColor = "#0d1119"
secondaryBackgroundColor = "#131824"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
