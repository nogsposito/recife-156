[theme]
base = "dark"
primaryColor = "#bea57d"
backgroundColor = "#080f0f"
secondaryBackgroundColor = "#0f1a19"
textColor = "#eff2c0"
borderColor = "#1d2b29"
linkColor = "#bea57d"
linkUnderline = false
baseRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
font = "Outfit:https://fonts.googleapis.com/css2?family=Outfit:wght@400..700&display=swap, sans-serif"
codeFont = "DM Mono:https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = [500, 500, 500, 500, 500, 500]
dataframeHeaderBackgroundColor = "#0f1a19"
chartCategoricalColors = ["#bea57d", "#eff2c0", "#a4bab7", "#a52422"]

[theme.sidebar]
backgroundColor = "#0b1413"
secondaryBackgroundColor = "#0f1a19"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
